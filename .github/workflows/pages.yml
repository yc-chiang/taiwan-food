name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/brave-dirac-6rbzp4']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不取消進行中的，避免半途中斷留下壞掉的站
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 組出要發布的檔案
        run: |
          mkdir -p _site/assets/foods _site/src
          cp index.html _site/
          cp -r src/. _site/src/
          # 只帶網頁實際用到的資產。
          # assets/*.png 是原始大圖（各約 3MB），頁面讀的是壓縮後的 .jpg，不需要上傳。
          cp assets/bgm.mp3 assets/esophagus.jpg assets/stomach.jpg _site/assets/
          cp assets/foods/*.jpg _site/assets/foods/
          # 關掉 Jekyll，否則底線開頭的檔案會被吃掉
          touch _site/.nojekyll
          du -sh _site

      # 注意：不能用 enablement: true 自動開啟 Pages ——
      # Actions 的預設 GITHUB_TOKEN 沒有建立 Pages 站台的權限，
      # 一定會收到 "Resource not accessible by integration"。
      # Pages 必須先由 repo 擁有者在 Settings → Pages 開啟並把 Source 設為 GitHub Actions。
      #
      # continue-on-error + 後續條件判斷：若 Pages 尚未設定成 Actions 來源，
      # 這個 workflow 會安靜跳過而不是每次推送都留一個失敗紀錄。
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::Pages 尚未啟用，或 Source 不是 GitHub Actions，已略過部署。"
          echo "請到 Settings → Pages，將 Source 設為 GitHub Actions 後重跑此 workflow。"
